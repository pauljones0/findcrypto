version: 2

project_name: findcrypto

metadata:
  mod_timestamp: "{{ .CommitTimestamp }}"

# findcrypto is the primary command. The findbtc builds are intentionally kept
# for one compatibility cycle so existing scripts and package-manager channels
# do not break when the repository moves from findbtc_sandbox to findcrypto.
builds:
  - id: findcrypto
    main: .
    binary: findcrypto
    goos: [darwin, windows]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w -X main.version={{ .Version }}
    env: [CGO_ENABLED=0]
  - id: findcrypto-linux
    main: .
    binary: findcrypto
    goos: [linux]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w -X main.version={{ .Version }}
    env: [CGO_ENABLED=0]
  - id: findbtc-compat
    main: .
    binary: findbtc
    goos: [darwin, windows]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w -X main.version={{ .Version }}
    env: [CGO_ENABLED=0]
  - id: findbtc-compat-linux
    main: .
    binary: findbtc
    goos: [linux]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w -X main.version={{ .Version }}
    env: [CGO_ENABLED=0]

archives:
  - id: findcrypto
    ids: [findcrypto, findcrypto-linux]
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "findcrypto_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files: [LICENSE, README.md, CHANGELOG.md]
  - id: findbtc-compat
    ids: [findbtc-compat, findbtc-compat-linux]
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "findbtc_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files: [LICENSE, README.md, CHANGELOG.md]

checksum:
  name_template: checksums.txt

# SPDX SBOM per archive, generated with syft during a manual release.
sboms:
  - artifacts: archive

# The primary Linux package installs both command names. New documentation and
# completion assets live under findcrypto; findbtc is only a binary alias.
nfpms:
  - id: findcrypto
    package_name: findcrypto
    ids: [findcrypto-linux, findbtc-compat-linux]
    formats: [deb, rpm]
    provides: [findbtc]
    conflicts: [findbtc]
    replaces: [findbtc]
    maintainer: Paul Jones <32859666+pauljones0@users.noreply.github.com>
    description: Recover cryptocurrency wallet traces from devices and forensic images
    homepage: https://github.com/pauljones0/findcrypto
    license: GPL-3.0-or-later
    contents:
      - src: LICENSE
        dst: /usr/share/doc/findcrypto/LICENSE
      - src: README.md
        dst: /usr/share/doc/findcrypto/README.md
      - src: CHANGELOG.md
        dst: /usr/share/doc/findcrypto/CHANGELOG.md
      - src: docs/BENCHMARKS.md
        dst: /usr/share/doc/findcrypto/BENCHMARKS.md
      - src: docs/PIPELINE_INGEST.md
        dst: /usr/share/doc/findcrypto/PIPELINE_INGEST.md
      - src: docs/RESOURCE_BOUNDS.md
        dst: /usr/share/doc/findcrypto/RESOURCE_BOUNDS.md
      - src: packaging/completion/findcrypto.bash
        dst: /usr/share/bash-completion/completions/findcrypto
      - src: packaging/completion/_findcrypto
        dst: /usr/share/zsh/vendor-completions/_findcrypto
      - src: packaging/completion/_findcrypto
        dst: /usr/share/zsh/site-functions/_findcrypto
      - src: packaging/completion/findcrypto.fish
        dst: /usr/share/fish/vendor_completions.d/findcrypto.fish
      - src: packaging/man/findcrypto.1
        dst: /usr/share/man/man1/findcrypto.1

  # Preserve the v0.2 package name and payload layout for automation that still
  # consumes findbtc artifacts. It contains the compatibility command only.
  - id: findbtc-compat
    package_name: findbtc
    ids: [findbtc-compat-linux]
    formats: [deb, rpm]
    conflicts: [findcrypto]
    maintainer: Paul Jones <32859666+pauljones0@users.noreply.github.com>
    description: Compatibility command for the renamed findcrypto scanner
    homepage: https://github.com/pauljones0/findcrypto
    license: GPL-3.0-or-later
    contents:
      - src: LICENSE
        dst: /usr/share/doc/findbtc/LICENSE
      - src: README.md
        dst: /usr/share/doc/findbtc/README.md
      - src: CHANGELOG.md
        dst: /usr/share/doc/findbtc/CHANGELOG.md
      - src: docs/BENCHMARKS.md
        dst: /usr/share/doc/findbtc/BENCHMARKS.md
      - src: docs/PIPELINE_INGEST.md
        dst: /usr/share/doc/findbtc/PIPELINE_INGEST.md
      - src: docs/RESOURCE_BOUNDS.md
        dst: /usr/share/doc/findbtc/RESOURCE_BOUNDS.md
      - src: packaging/completion/findbtc.bash
        dst: /usr/share/bash-completion/completions/findbtc
      - src: packaging/completion/_findbtc
        dst: /usr/share/zsh/vendor-completions/_findbtc
      - src: packaging/completion/_findbtc
        dst: /usr/share/zsh/site-functions/_findbtc
      - src: packaging/completion/findbtc.fish
        dst: /usr/share/fish/vendor_completions.d/findbtc.fish
      - src: packaging/man/findbtc.1
        dst: /usr/share/man/man1/findbtc.1

# The scratch image contains findcrypto plus the findbtc compatibility command,
# built from the same commit and static toolchain.
dockers_v2:
  - ids: [findcrypto-linux, findbtc-compat-linux]
    images: [ghcr.io/pauljones0/findcrypto]
    tags: ["{{ .Version }}", latest]
    extra_files: [LICENSE, README.md, CHANGELOG.md]
    labels:
      org.opencontainers.image.title: findcrypto
      org.opencontainers.image.description: Recover cryptocurrency wallet traces from devices and forensic images
      org.opencontainers.image.source: https://github.com/pauljones0/findcrypto
      org.opencontainers.image.licenses: GPL-3.0-or-later
    annotations:
      org.opencontainers.image.revision: "{{ .FullCommit }}"
      org.opencontainers.image.version: "{{ .Version }}"
      org.opencontainers.image.created: "{{ .Date }}"

# Existing public channels remain named findbtc until their maintainers migrate
# them. They consume the compatibility archive, so a findcrypto release can
# update them without breaking current installs.
homebrew_casks:
  - name: findbtc
    ids: [findbtc-compat]
    repository:
      owner: pauljones0
      name: homebrew-findbtc
    homepage: https://github.com/pauljones0/findcrypto
    description: Compatibility command for the renamed findcrypto scanner
    license: GPL-3.0-or-later
    skip_upload: true
    binaries: [findbtc]

winget:
  - name: findbtc
    ids: [findbtc-compat]
    package_identifier: pauljones0.findbtc
    publisher: Paul Jones
    publisher_url: https://github.com/pauljones0
    homepage: https://github.com/pauljones0/findcrypto
    short_description: Compatibility command for the renamed findcrypto scanner
    description: findcrypto scans raw block devices and forensic images for cryptocurrency wallet traces; findbtc is its compatibility command.
    license: GPL-3.0-or-later
    license_url: https://github.com/pauljones0/findcrypto/blob/main/LICENSE
    repository:
      owner: microsoft
      name: winget-pkgs
    skip_upload: true

snapshot:
  version_template: "{{ .Tag }}-SNAPSHOT-{{ .ShortCommit }}"

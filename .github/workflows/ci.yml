name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      # Let every OS/version report independently so an oracle drift on one
      # runner cannot masquerade as failures or hide results on the others.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        # Keep the declared module floor real while also exercising the latest
        # stable release. Go 1.26 is current oldstable, so a separate
        # "oldstable" entry would duplicate the floor job.
        go-version: ['1.26.x', stable]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: ${{ matrix.go-version }}
      - name: gofmt
        shell: bash
        run: test -z "$(gofmt -l .)"
      - name: oracle tools (BDB, FAT/exFAT, and XFS cross-checks)
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq db5.3-util xfsprogs sleuthkit
      - name: build
        run: go build ./...
      - name: vet
        run: go vet ./...
      - name: test
        run: go test ./... -count=1
      - name: fuzz smoke
        if: matrix.os == 'ubuntu-latest'
        run: |
          for f in FuzzBIP39 FuzzKeys FuzzKeystore FuzzBase58 FuzzZipLocalHeader; do
            go test ./detector/ -run NONE -fuzz "^$f\$" -fuzztime 15s
          done

  password-handoff:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      JOHN_VERSION: '1.9.0-jumbo-1'
      JOHN_SHA256: '8b40499a20fdd66d5f651b439bf9846367182bb93e8bff3fd39ba267576dd317'
      HASHCAT_VERSION: '6.2.6'
      BTCR_SHA: '1457088acf17630eb12a5b53989982ac34e55f2a'
      ETH_KEYFILE_VERSION: '0.6.0'
      SETUPTOOLS_VERSION: '80.9.0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: stable
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: install hashcat + pocl
        run: sudo apt-get update -qq && sudo apt-get install -y -qq hashcat pocl-opencl-icd libssl-dev zlib1g-dev patch
      - name: cache john build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /tmp/john-src
          key: john-${{ env.JOHN_VERSION }}-${{ hashFiles('scripts/john-1.9.0-jumbo-1-gcc13-blake2.patch') }}
      - name: build john
        run: |
          if [ -x "/tmp/john-src/john-${JOHN_VERSION}/run/john" ]; then exit 0; fi
          mkdir -p /tmp/john-src && cd /tmp/john-src
          curl --fail --show-error --location -o john.tar.gz "https://www.openwall.com/john/k/john-${JOHN_VERSION}.tar.gz"
          echo "$JOHN_SHA256 *john.tar.gz" | sha256sum -c -
          tar xzf john.tar.gz
          cd "john-${JOHN_VERSION}"
          patch -p0 < "$GITHUB_WORKSPACE/scripts/john-1.9.0-jumbo-1-gcc13-blake2.patch"
          cd src && ./configure && make -s -j"$(nproc)"
      - name: cache pocl kernels
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /tmp/pocl-cache
          key: pocl-hashcat-${{ env.HASHCAT_VERSION }}
      - name: clone btcrecover
        run: git clone -q https://github.com/3rdIteration/btcrecover /tmp/btcrecover && git -C /tmp/btcrecover checkout -q "$BTCR_SHA"
      - name: install btcrecover deps
        run: python3 -m pip install -q "wallycore>=1.0.0" "protobuf~=5.29.6" "pycryptodome~=3.23.0" "eth-keyfile==$ETH_KEYFILE_VERSION" "setuptools==$SETUPTOOLS_VERSION"
      - name: diagnose python env
        run: |
          which -a python3 pip pip3 || true
          python3 --version; python3 -m pip --version
          python3 -c "import sys; print(sys.executable); print(sys.version); [print(p) for p in sys.path]"
          python3 -m pip show -f pycryptodome || echo NO_PYDIST
          python3 -c "import Crypto; print(Crypto.__file__)" || echo NO_CRYPTO_IMPORT
      - name: assert tool pins
        run: |
          hashcat --version | grep -q "v$HASHCAT_VERSION"
          "/tmp/john-src/john-$JOHN_VERSION/run/john" 2>&1 | grep -q "John the Ripper $JOHN_VERSION"
          test "$(git -C /tmp/btcrecover rev-parse HEAD)" = "$BTCR_SHA"
          python3 -c "import importlib.metadata as m; assert m.version('eth-keyfile') == '$ETH_KEYFILE_VERSION', m.version('eth-keyfile')"
          python3 -c "import importlib.metadata as m; assert m.version('setuptools') == '$SETUPTOOLS_VERSION', m.version('setuptools')"
          python3 -c "from Crypto.Cipher import AES; from Crypto.Hash import keccak"
      - name: run password handoff
        run: |
          go build -o /tmp/findcrypto-handoff .
          FINDCRYPTO=/tmp/findcrypto-handoff JOHN="/tmp/john-src/john-$JOHN_VERSION/run/john" HASHCAT=hashcat BTCR_DIR=/tmp/btcrecover PYTHON=python3 POCL_CACHE_DIR=/tmp/pocl-cache scripts/password-handoff.sh "$GITHUB_WORKSPACE" /tmp/handoff-work

  owner-rehearsal:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: stable
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: run owner rehearsal
        run: |
          go build -o /tmp/findcrypto-rehearsal .
          FINDCRYPTO=/tmp/findcrypto-rehearsal PYTHON=python3 scripts/owner-rehearsal.sh "$GITHUB_WORKSPACE" /tmp/rehearsal-work

  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: stable
      # Binary mode scans exactly what ships and excludes unreachable
      # test/tooling-only dependencies from the release gate.
      - name: govulncheck
        run: |
          go build -o /tmp/findcrypto-gate .
          go run golang.org/x/vuln/cmd/govulncheck@v1.10.0 -mode=binary /tmp/findcrypto-gate
      - name: staticcheck
        run: |
          (cd /tmp && curl -sL -O 'https://github.com/dominikh/go-tools/releases/download/2026.2.2/staticcheck_linux_amd64.tar.gz' && curl -sL -O 'https://github.com/dominikh/go-tools/releases/download/2026.2.2/staticcheck_linux_amd64.tar.gz.sha256' && sha256sum -c staticcheck_linux_amd64.tar.gz.sha256 && tar xzf staticcheck_linux_amd64.tar.gz)
          /tmp/staticcheck/staticcheck ./...
